confirmOnQuit: true
disableStartupPopups: true
gui:
  language: en
  portraitMode: never
  shortTimeFormat: 15:04
  timeFormat: 2006-01-02
notARepository: quit
os:
  copyToClipboardCmd: "wl-copy"
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  open: "nvim {{filename}}"
  openDirInEditor: "nvim {{dir}}"
  openLink: "xdg-open {{link}}"
  readFromClipboardCmd: "wl-paste --no-newline"
  shellFunctionsFile: "~/.zshrc"
update:
  method: never # handled by the package manager
